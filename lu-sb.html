<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嶺南大學 南行</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e8eaf6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh;padding:16px}
header{text-align:center;padding:16px 0 12px;border-bottom:1px solid #1e2235;margin-bottom:16px;position:relative}
header h1{font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:.5px}
#eta-list{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.eta-card{background:#161929;border:1px solid #1e2235;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.eta-card:hover{background:#1a1f33}
.route-badge{min-width:90px;text-align:center;border-radius:8px;padding:8px 10px;font-size:2.5rem;font-weight:700;letter-spacing:.5px;flex-shrink:0}
.badge-KMB{background:#7c1010;color:#ffd0d0}
.badge-LWB{background:#1a5c1a;color:#c8f5c8}
.badge-MTR{background:#4c1d95;color:#e9d5ff}
.dest-block{flex:1;min-width:0}
.dest-zh{font-size:1.3rem;font-weight:500;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-en{font-size:.95rem;color:#718096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.fare-tag{font-size:.88rem;color:#f6ad55;margin-top:4px}
.eta-times{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.eta-pill-first{font-size:1.5rem;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap}
.eta-pill{font-size:1rem;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.eta-arriving{background:#14532d;color:#86efac}
.eta-soon{background:#78350f;color:#fcd34d}
.eta-normal{background:#1e2235;color:#a0aec0}
.loading-state,.error-state,.no-service{text-align:center;padding:40px 20px;color:#4b5563;font-size:.95rem}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid #2d3149;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Refresh indicator */
#refresh-status{display:inline-block;margin-left:10px;font-size:0.8rem;color:#718096;vertical-align:middle}
#refresh-status .spinner-small{display:inline-block;width:14px;height:14px;border:2px solid #2d3149;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1>嶺南大學站 南行 <span id="refresh-status"></span></h1>
    <p>Lingnan University Southbound</p>
</header>
<div id="eta-list">
  <div class="loading-state"><div class="spinner"></div><br>Loading ETAs...</div>
</div>

<script>
var CONFIG = {
  KMB_BASE: 'https://data.etabus.gov.hk/v1/transport/kmb',
  MTR_URL:  'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',
  REFRESH_INTERVAL: 30000,
  DEPARTED_THRESHOLD: -60
};

var MTR_ROUTES  = ['K51','K51A','K58'];
var KMB_STOP_ID = 'AA5DA45828958EAE';
var KMB_ROUTES  = ['53','67M','67X','258P','261','267X','960S'];
var LWB_STOP_ID = 'CC3EF4757AA0964A';
var LWB_ROUTES  = ['A33X','E33P'];

var FARES = {
  'MTR_K51':  {adult:'$5.1',  conc:'$2.6'},
  'MTR_K51A': {adult:'$5.1',  conc:'$2.6'},
  'MTR_K58':  {adult:'$5.1',  conc:'$2.6'},
  'KMB_53':   {adult:'$10.0', conc:'$5.0'},
  'KMB_67M':  {adult:'$10.8', conc:'$5.4'},
  'KMB_67X':  {adult:'$14.6', conc:'$7.3'},
  'KMB_258P': {adult:'$13.4', conc:'$6.7'},
  'KMB_261':  {adult:'$10.8', conc:'$5.4'},
  'KMB_267X': {adult:'$18.8', conc:'$9.4'},
  'KMB_960S': {adult:'$24.0', conc:'$12.0'},
  'LWB_A33X': {adult:'$15.7', conc:'$7.9'},
  'LWB_E33P': {adult:'$12.4', conc:'$6.2'}
};

// Fallback destinations for MTR routes (southbound from Lingnan University)
// Based on known routes; adjust if needed.
var MTR_DEST_MAP = {
  'K51':  { tc: '大欖', en: 'Tai Lam' },
  'K51A': { tc: '掃管笏', en: 'So Kwun Wat' },
  'K58':  { tc: '掃管笏', en: 'So Kwun Wat' }   // Verify actual destination
};

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toSentenceCase(s){
  if(!s) return '';
  s=s.trim();
  return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
}
function fetchJSON(url){
  return fetch(url).then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.json();});
}
function postJSON(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.json();});
}

// Enhanced MTR time parsing: handles "HH:MM", "Due", "Arriving", "X min", "Departed"
function mtrTextToSeconds(text){
  if(!text) return null;
  var lower = text.toLowerCase().trim();
  // Exact matches for imminent buses
  if(lower === 'arriving' || lower === 'due' || lower === '0' || lower === '-' || lower === '--') return 0;
  // Departed buses (ignore)
  if(lower.includes('departed')) return null;
  // Extract number of minutes (e.g., "5 min", "5 mins", "5minutes")
  var minMatch = lower.match(/(\d+)\s*min/);
  if(minMatch) return parseInt(minMatch[1], 10) * 60;
  // HH:MM format (e.g., "14:30")
  var m = text.match(/^(\d{1,2}):(\d{2})$/);
  if(m) {
    var now = new Date();
    var target = new Date();
    target.setHours(parseInt(m[1],10), parseInt(m[2],10), 0, 0);
    var secs = (target - now) / 1000;
    if(secs < -3600) secs += 86400; // past midnight wrap
    return secs;
  }
  return null; // unparseable
}

function secondsUntil(etaStr){
  if(!etaStr) return null;
  return (new Date(etaStr) - Date.now()) / 1000;
}

function etaPill(secs, isFirst){
  if(secs===null) return '';
  var mins = Math.round(secs/60);
  var sz  = isFirst ? 'eta-pill-first' : 'eta-pill';
  var col = mins<=0 ? 'eta-arriving' : (mins<=5 ? 'eta-soon' : 'eta-normal');
  var lbl = mins<=0 ? 'Arriving' : (mins+' min');
  return '<span class="'+sz+' '+col+'">'+lbl+'</span>';
}

// ── Fetchers ──────────────────────────────────────────────────

function getKmbLikeEtas(stopId, routes, operator){
  return fetchJSON(CONFIG.KMB_BASE+'/stop-eta/'+stopId)
    .then(function(data){
      if(!data||!data.data) return [];
      return data.data
        .filter(function(e){ return routes.indexOf((e.route||'').toUpperCase())!==-1; })
        .map(function(e){ return Object.assign({},e,{_operator:operator,route:(e.route||'').toUpperCase()}); });
    }).catch(function(){ return []; });
}

// Fetch one MTR route, keep only stops whose busStopId ends with "U030"
// and extract actual destination from bus object if available.
function getMtrRoute(routeName){
  return postJSON(CONFIG.MTR_URL, {language:'en', routeName: routeName})
    .then(function(data){
      var stops = (data.busStop || []).filter(function(s){
        return s.busStopId && s.busStopId.toUpperCase().endsWith('U030');
      });
      var out = [];
      stops.forEach(function(stop){
        (stop.bus || []).forEach(function(bus, i){
          var secs = mtrTextToSeconds(bus.departureTimeText || null);
          if(secs === null) return;
          // Try to get destination from bus object, fallback to hardcoded map
          var destTc = bus.destination_tc || (MTR_DEST_MAP[routeName] ? MTR_DEST_MAP[routeName].tc : '');
          var destEn = bus.destination_en || (MTR_DEST_MAP[routeName] ? MTR_DEST_MAP[routeName].en : '');
          // If still empty, use stop name as last resort (but should not happen)
          if(!destTc) destTc = stop.busStopName || '';
          if(!destEn) destEn = stop.busStopName || '';
          out.push({
            _operator: 'MTR',
            route: routeName,
            _secs: secs,
            eta_seq: i + 1,
            dest_tc: destTc,
            dest_en: destEn
          });
        });
      });
      return out;
    }).catch(function(){ return []; });
}

function getAllMtrEtas(){
  return Promise.all(MTR_ROUTES.map(getMtrRoute))
    .then(function(arrs){ return arrs.reduce(function(a,b){return a.concat(b);},[]);});
}

// ── Group & Sort ──────────────────────────────────────────────

function groupAndSort(all){
  var groups = {};
  all.forEach(function(e){
    var key = e._operator+'_'+e.route;
    if(!groups[key]){
      groups[key]={route:e.route, operator:e._operator,
        dest_tc: e.dest_tc||e.rmk_tc||'',
        dest_en: e.dest_en||e.rmk_en||'',
        etas:[]};
    }
    var secs = (e._secs !== undefined) ? e._secs : secondsUntil(e.eta);
    if(secs!==null && secs < CONFIG.DEPARTED_THRESHOLD) return;
    if(secs===null) return;
    groups[key].etas.push({secs:secs, seq:e.eta_seq||99});
  });

  var result = Object.values(groups).filter(function(g){return g.etas.length>0;});
  result.forEach(function(g){
    // Sort ETAs by time ascending, then by sequence (for MTR order)
    g.etas.sort(function(a,b){ return a.secs - b.secs || a.seq - b.seq; });
    g.sortKey = g.etas[0].secs;
  });
  result.sort(function(a,b){return a.sortKey-b.sortKey;});
  return result;
}

// ── Render ────────────────────────────────────────────────────

function badgeCls(op){
  return op==='KMB'?'badge-KMB': op==='LWB'?'badge-LWB': op==='MTR'?'badge-MTR':'badge-KMB';
}

function render(groups){
  var list = document.getElementById('eta-list');
  if(!groups.length){
    list.innerHTML='<div class="no-service">No buses with live ETA right now.</div>';
    return;
  }
  var html='';
  groups.forEach(function(g){
    var fare = FARES[g.operator+'_'+g.route];
    var fareHtml = fare ? '<div class="fare-tag">Adult '+escapeHtml(fare.adult)+' &nbsp;|&nbsp; Conc. '+escapeHtml(fare.conc)+'</div>' : '';
    var pills = g.etas.slice(0,3).map(function(e,i){return etaPill(e.secs,i===0);}).join('');
    html += '<div class="eta-card">'
      +'<div class="route-badge '+badgeCls(g.operator)+'">'+escapeHtml(g.route)+'</div>'
      +'<div class="dest-block">'
      +'<div class="dest-zh">'+escapeHtml(g.dest_tc)+'</div>'
      +'<div class="dest-en">'+escapeHtml(toSentenceCase(g.dest_en))+'</div>'
      +fareHtml
      +'</div>'
      +'<div class="eta-times">'+pills+'</div>'
      +'</div>';
  });
  list.innerHTML = html;
}

// ── Load All with refresh indicator and recursive timeout ─────

var refreshStatus = document.getElementById('refresh-status');
var refreshTimer = null;

function showRefreshing(active) {
  if(active) {
    refreshStatus.innerHTML = '<span class="spinner-small"></span> Updating...';
  } else {
    refreshStatus.innerHTML = '';
  }
}

function loadAll(){
  showRefreshing(true);
  Promise.all([
    getKmbLikeEtas(KMB_STOP_ID, KMB_ROUTES, 'KMB'),
    getKmbLikeEtas(LWB_STOP_ID, LWB_ROUTES, 'LWB'),
    getAllMtrEtas()
  ]).then(function(results){
    render(groupAndSort(results[0].concat(results[1]).concat(results[2])));
    showRefreshing(false);
  }).catch(function(err){
    document.getElementById('eta-list').innerHTML=
      '<div class="error-state">Failed to load data.<br><small>'+escapeHtml(err.message)+'</small></div>';
    showRefreshing(false);
  }).finally(function() {
    // Schedule next update after current one completes + interval
    if(refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(loadAll, CONFIG.REFRESH_INTERVAL);
  });
}

// Initial load
loadAll();

// No setInterval – using recursive setTimeout to avoid overlapping calls
</script>
</body>
</html>
